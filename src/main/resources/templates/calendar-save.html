<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      layout:decorate="~{fragment/default}"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"

>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BeONE - 그룹일정</title>



  <!-- Bootstrap 5 CSS -->
  <link th:href="@{https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css}" rel="stylesheet">

  <!-- FullCalendar CSS -->
  <link th:href="@{https://cdn.jsdelivr.net/npm/fullcalendar@5.11.5/main.min.css}" rel="stylesheet">

  <style>
    #calendar {
      width: 100%;
      max-width: 900px;
      margin: 0 auto;
      height: 700px;
    }

    .color-option {
      display: inline-block;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      margin: 5px;
      cursor: pointer;
      border: 2px solid transparent;
    }

    .color-option:hover {
      border: 2px solid #000;
    }

  </style>
</head>
<body layout:fragment="content">


<div id="calendarGroupId" style="display: none" th:attr="data-calendar-group-id=${calendarGroupId}"></div>
<div id="calendarId" style="display: none" th:attr="data-calendar-id=${calendarId}"></div>

<div class="container mt-5">
  <h1 class="text-center text-primary" th:text="${groupName}"></h1>
  <div id="calendar"></div>
</div>

<!-- 일정 상세 모달 -->
<div class="modal fade" id="eventModal" tabindex="-1" aria-labelledby="eventModalLabel" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="eventModalLabel">일정 상세</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <p><strong>제목:</strong> <span id="modalEventTitle"></span></p>
        <p><strong>작성자:</strong> <span id="modalEventWriter"></span></p>
        <p><strong>시작 날짜:</strong> <span id="modalEventStart"></span></p>
        <p><strong>종료 날짜:</strong> <span id="modalEventEnd"></span></p>
        <p><strong>설명:</strong> <span id="modalEventDescription"></span></p>
        <label><strong>색상 선택:</strong></label>
        <div id="eventDetailColorOptions">
          <span class="color-option" style="background-color: #ff5733;"></span>
          <span class="color-option" style="background-color: #33ff57;"></span>
          <span class="color-option" style="background-color: #3357ff;"></span>
          <span class="color-option" style="background-color: #ff33d4;"></span>
          <span class="color-option" style="background-color: #ffbb33;"></span>
          <!-- 선택된 색상을 저장할 hidden input -->

        </div>
        <input type="hidden" id="selectedEventDetailColor" name="eventColor">
        <input type="hidden" id="selectedEventId">
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-danger" id="modifyEvent" data-bs-dismiss="modal">수정/삭제</button>
        <button type="button" class="btn btn-primary" id="saveEventColor" data-bs-dismiss="modal">저장</button>
      </div>
    </div>
  </div>
</div>


<!--  일정 추가 모달 -->
<div class="modal fade" id="addEventModal" tabindex="-1" aria-labelledby="addEventModalLabel" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="addEventModalLabel">일정 추가</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <form id="addEventForm">
          <div class="mb-3">
            <label for="eventTitle" class="form-label">제목</label>
            <input type="text" id="eventTitle" class="form-control" required>
          </div>
          <div class="mb-3">
            <label for="eventStartDate" class="form-label">시작 날짜 및 시간</label>
            <input type="datetime-local" id="eventStartDate" class="form-control" required>
          </div>
          <div class="mb-3">
            <label for="eventEndDate" class="form-label">마감 날짜 및 시간</label>
            <input type="datetime-local" id="eventEndDate" class="form-control">
          </div>
          <div class="mb-3">
            <label for="eventDescription" class="form-label">설명</label>
            <textarea id="eventDescription" class="form-control"></textarea>
          </div>
          <div class="mb-3">
            <label><strong>색상 선택:</strong></label>
            <div id="eventColorOptions">
              <span class="color-option" style="background-color: #ff5733;"></span>
              <span class="color-option" style="background-color: #33ff57;"></span>
              <span class="color-option" style="background-color: #3357ff;"></span>
              <span class="color-option" style="background-color: #ff33d4;"></span>
              <span class="color-option" style="background-color: #ffbb33;"></span>

            </div>
            <input type="hidden" id="selectedEventColor" name="eventColor">
            <input type="hidden" id="eventWriter" th:value="${name}">

          </div>
          <button type="submit" class="btn btn-primary">추가</button>
        </form>
      </div>
    </div>
  </div>
</div>

<!-- FullCalendar JS -->
<script th:src="@{https://cdn.jsdelivr.net/npm/fullcalendar@5.11.5/main.min.js}"></script>


<script th:inline="javascript">


  document.addEventListener('DOMContentLoaded', function () {


    const detailColorOptions = document.querySelectorAll('#eventDetailColorOptions .color-option');
    const selectedEventDetailColorInput = document.getElementById('selectedEventDetailColor');

    // 색상 선택 기능 추가 (일정 상세 모달)
    detailColorOptions.forEach(option => {
      option.addEventListener('click', function () {
        // 모든 색상 옵션의 선택 테두리 제거
        detailColorOptions.forEach(opt => opt.style.border = "2px solid transparent");

        // 선택된 색상 테두리 강조
        this.style.border = "2px solid black";

        // 선택된 색상을 hidden input에 저장
        selectedEventDetailColorInput.value = this.style.backgroundColor;
      });
    });

    const colorOptions = document.querySelectorAll('#eventColorOptions .color-option');
    const selectedEventColorInput = document.getElementById('selectedEventColor');

    colorOptions.forEach(option => {
      option.addEventListener('click', function () {
        // 모든 색상 옵션의 선택 테두리 제거
        colorOptions.forEach(opt => opt.style.border = "2px solid transparent");

        // 선택된 색상 테두리 강조
        this.style.border = "2px solid black";

        // 선택된 색상을 hidden input에 저장
        selectedEventColorInput.value = this.style.backgroundColor;
      });
    });

    let calendarEl = document.getElementById('calendar');

    let selectedEvent = null;

    let calendar = new FullCalendar.Calendar(calendarEl, {
      initialView: 'dayGridMonth',
      headerToolbar: {
        left: 'prev,next today',
        center: 'title',
        right: 'dayGridMonth,timeGridWeek,timeGridDay'
      },
      displayEventTime: false,

      // events: events, // 기존 일정 데이터 적용


      //  날짜 클릭 시 일정 추가 모달 띄우기
      dateClick: function (info) {
        document.getElementById('eventStartDate').value = info.dateStr + "T00:00"; // 기본 시작 시간
        document.getElementById('eventEndDate').value = info.dateStr + "T23:59"; // 기본 마감 시간

        let addEventModal = new bootstrap.Modal(document.getElementById('addEventModal'));
        addEventModal.show();
      },

      //  일정 클릭 시 상세 모달 띄우기
      eventClick: function (info) {
        selectedEvent = info.event; // 현재 선택한 이벤트 저장

        //  모달에 이벤트 정보 표시
        document.getElementById('modalEventTitle').innerText = selectedEvent.title;
        document.getElementById('modalEventWriter').innerText = selectedEvent.extendedProps.name
            || "알수없음";
        document.getElementById('modalEventStart').innerText = selectedEvent.start.toLocaleString();
        document.getElementById('modalEventEnd').innerText = selectedEvent.end?.toLocaleString();
        document.getElementById(
            'modalEventDescription').innerText = selectedEvent.extendedProps.description || "설명 없음";

        // 기존 색상을 hidden input에 설정
        document.getElementById('selectedEventDetailColor').value = selectedEvent.backgroundColor;
        document.getElementById('selectedEventId').value = selectedEvent.id;

        // 기존 선택된 색상을 강조 (테두리 변경)
        const detailColorOptions = document.querySelectorAll(
            '#eventDetailColorOptions .color-option');
        detailColorOptions.forEach(option => {
          if (option.style.backgroundColor === selectedEvent.backgroundColor) {
            option.style.border = "2px solid black"; // 선택된 색상 강조
          } else {
            option.style.border = "2px solid transparent";
          }
        });

        let eventModal = new bootstrap.Modal(document.getElementById('eventModal'));
        eventModal.show();
      }

    });

    // calendar.getEventSources().forEach(eventSource => eventSource.remove());


    calendar.setOption('eventSources', [{
      url: '/calendar/events',
      method: 'GET',
      extraParams: function() {
        let view = calendar.view;  //  이제 'calendar' 변수가 존재하는 상태에서 실행됨!


        let calendarGroupId = document.getElementById("calendarGroupId").getAttribute("data-calendar-group-id");
        console.log(calendarGroupId);

        return {
          calendarGroupId: encodeURIComponent(btoa(calendarGroupId))
        };
      },
      failure: function() {
        alert(" 일정을 불러오는 데 실패했습니다.");
      }
    }]);

    //  월이 변경될 때 이벤트 다시 불러오기
    // calendar.on('datesSet', function() {
    //   console.log("📢 FullCalendar 날짜 변경 감지! 이벤트 다시 로드");
    //   calendar.refetchEvents();
    // });

    calendar.render();




    //   // 일정 클릭 시 상세 모달 열기
    // document.getElementById('calendar').addEventListener('eventClick', function(info) {
    //
    //   selectedEvent = info.event;
    //
    //   // 기존 색상 설정
    //   selectedEventDetailColorInput.value = selectedEvent.backgroundColor;
    //
    //   // 모달의 색상 옵션 중 현재 색상과 일치하는 항목에 테두리 추가
    //   detailColorOptions.forEach(option => {
    //     if (option.style.backgroundColor === selectedEvent.backgroundColor) {
    //       option.style.border = "2px solid black";
    //     } else {
    //       option.style.border = "2px solid transparent";
    //     }
    //   });
    //
    //   let eventModal = new bootstrap.Modal(document.getElementById('eventModal'));
    //   eventModal.show();
    // });


    function btoaUTF8(data) {
      const utf8Data = new TextEncoder().encode(data);
      let binaryString = "";
      for (let i = 0; i < utf8Data.length; i++) {
        binaryString += String.fromCharCode(utf8Data[i]);
      }
      return btoa(binaryString)
      .replace(/\+/g, "-") // Base64 -> Base64URL
      .replace(/\//g, "_") // Base64 -> Base64URL
      .replace(/=+$/, ""); // 패딩 제거
    }

    document.getElementById("modifyEvent").addEventListener("click",function (){

      if (selectedEvent){
        const eventId = document.getElementById("selectedEventId").value;
        let title = document.getElementById("modalEventTitle").value;
        let start = document.getElementById('modalEventStart').value;
        let end = document.getElementById('modalEventEnd').value;
        let description = document.getElementById('modalEventDescription').value;


      }
    })

    // 색상 저장 버튼 클릭 시 이벤트 색상 업데이트
    document.getElementById('saveEventColor').addEventListener('click', function () {
      if (selectedEvent) {
        let newColor = document.getElementById('selectedEventDetailColor').value;

        // FullCalendar에서 색상 변경
        selectedEvent.setProp('backgroundColor', newColor);
        selectedEvent.setProp('borderColor', newColor);
        console.log("eventId = " + selectedEvent.id);
        console.log("eventId = " + newColor);

        // 백엔드로 색상 변경 요청 보내기
        fetch('/calendar/event/color', {
          method: 'PATCH',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            eventId: selectedEvent.id,
            backgroundColor: newColor,
            borderColor: newColor
          })
        })
        .then(response => {
          if (!response.ok) {
            throw new Error("색상 업데이트 실패");
          }
          return response.json();
        })
        .then(data => {
          console.log("색상 업데이트 성공:", data);

          // FullCalendar에 즉시 반영 (리렌더링)
          // calendar.refetchEvents();
        })
        .catch(error => {
          console.error("색상 변경 중 오류 발생:", error);
        });
      }
    });


    //  일정 추가 폼 제출 이벤트
    document.getElementById('addEventForm').addEventListener('submit', function(event) {
      event.preventDefault();

      let startInput = document.getElementById('eventStartDate').value;
      let endInput = document.getElementById('eventEndDate').value;

      // `datetime-local` 입력값을 `Date.parse()`를 사용해 변환 (UTC 변환 없이 로컬 시간 유지)
      let startDateTime = new Date(startInput.replace("T", " ") + ":00"); // 초 단위 추가
      let endDateTime = new Date(endInput.replace("T", " ") + ":00");

      console.log(startDateTime);  // 한국 시간 그대로 출력
      console.log(endDateTime);

      // 종료 시간이 시작 시간보다 같거나 이전이면 막기
      if (endDateTime.getTime() <= startDateTime.getTime()) {
        alert('종료 날짜와 시간은 시작 날짜와 시간 이후여야 합니다.');
        return;
      }

      console.log()
      let newEvent = {
        calendarId: document.getElementById("calendarId").getAttribute("data-calendar-id"),
        title: document.getElementById('eventTitle').value,
        start: document.getElementById('eventStartDate').value,
        end: document.getElementById('eventEndDate').value || document.getElementById(
            'eventStartDate').value,
        backgroundColor: document.getElementById('selectedEventColor').value,
        borderColor: document.getElementById('selectedEventColor').value,
        description: document.getElementById('eventDescription').value || "",
        writer: document.getElementById('eventWriter').value


      };



      //  백엔드로 일정 저장 요청
      fetch('/calendar/event', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json'
        },
        body: JSON.stringify(newEvent)
      })
      .then(response =>{
        if (response.ok) {
          return response.json();

        }else {
          alert("잘못된 입력입니다.");
        }

      })
      .then(data => {


        console.log("newEvent" + newEvent.toString());

        // 캘린더에 즉시 반영
        // calendar.addEvent({
        //   id: data.eventId,
        //   name: newEvent.writer,
        //   title: newEvent.title,
        //   start: newEvent.start,
        //   end: newEvent.end,
        //   description: newEvent.description,
        //   backgroundColor: newEvent.backgroundColor,
        //   borderColor: newEvent.borderColor
        // });

        calendar.refetchEvents();


        // 모달 닫기
        let addEventModal = bootstrap.Modal.getInstance(document.getElementById('addEventModal'));
        addEventModal.hide();

        // 입력 필드 초기화
        document.getElementById('addEventForm').reset();
      })
      .catch(error =>{
            console.error('Error:', error);
          }
      );
    });

  });

</script>


</body>
</html>
