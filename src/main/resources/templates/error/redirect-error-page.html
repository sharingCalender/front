<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
>
<head>
  <meta charset="UTF-8">
  <title>BeONE - 오류페이지</title>
  <link th:href="@{https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css}" rel="stylesheet">

  <style>
    img {
      max-width: 600px; /* 로고 크기 조정 */
      margin-bottom: 20px;
    }
  </style>
</head>
<body class="vh-100 d-flex justify-content-center align-items-center flex-column text-center">

<img src="/img/logo.png" alt="BeONE Logo">
<h1 th:text="${title}">서버에 오류가 발생했습니다.</h1>
<button type="button" id="home" class="btn btn-primary mt-3">
  돌아가기
</button>

<script th:inline="javascript">
  document.getElementById("home").addEventListener("click", function (){
    window.location.href = /*[[${redirect}]]*/ "/";

  });
</script>

</body>
</html>
