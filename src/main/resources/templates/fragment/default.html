<!DOCTYPE html>
<html lang="en"
      xmlns:th="https://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
>
<head>
  <meta charset="UTF-8">
  <meta name="_csrf" th:content="${_csrf.token}">
  <meta name="_csrf_header" th:content="${_csrf.headerName}" />
  <title>Title</title>

  <th:block th:replace="~{fragment/head :: headTemplate}"/>
</head>
<body class="sb-nav-fixed" style="display: block" >

<!-- 로그인 여부에 따라 로그인화면으로 이동 -->
  <script th:inline="javascript">
    let isLoggedIn = /*[[${isLoggedIn}]]*/ false;
    console.log("isLoggedIn = " + isLoggedIn);

    if (isLoggedIn) {
      document.body.style.display="block";
    } else{
      window.location.href = '/user/login';
    }

    const _csrf = document.querySelector(`meta[name="_csrf"]`).getAttribute('content');
    const _csrf_header = document.querySelector('meta[name="_csrf_header"]').getAttribute('content');

  </script>

  <div th:replace="~{fragment/topbar :: #topbarTemplate}"/> <!--topbar -->

  <div id="layoutSidenav">

    <div th:replace="~{fragment/sidebar :: #sidebarTemplate}"/> <!-- sidebar -->

    <div id="layoutSidenav_content">
      <!--main -->
      <main>
      <div layout:fragment="content"/>
      </main>

      <!--footer -->
      <div th:replace="~{fragment/footer :: #footerTemplate}"/>

  </div>

  </div>
<script th:src="@{https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js}"></script>

<script src="/js/scripts.js"></script>
</body>
</html>
