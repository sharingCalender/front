<!DOCTYPE html>
<html lang="en"

      xmlns:th="http://www.thymeleaf.org"
      layout:decorate="~{fragment/default}"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
>
<head>
  <meta charset="UTF-8">
  <title>BeONE - Group 목록</title>
  <link th:href="@{https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css}" rel="stylesheet">
  <script>
    function fetchGroupDetails(element) {




      const name = element.getAttribute("data-name");
      const groupName = element.getAttribute("data-group-name");
      const calendarId = element.getAttribute("data-calendar-id");
      const calendarGroupId = element.getAttribute("data-calendar-group-id");


      const encodedName = encodeURIComponent(btoaUTF8(name));
      const encodedGroupName = encodeURIComponent(btoaUTF8(groupName));
      const encodedCalendarId = encodeURIComponent(btoa(calendarId));
      const encodedCalendarGroupId = encodeURIComponent(btoa(calendarGroupId));

      window.location.href = `/calendar/page?name=${encodedName}&groupName=${encodedGroupName}&calendarId=${encodedCalendarId}&calendarGroupId=${encodedCalendarGroupId}`;

    }

    function btoaUTF8(data) {
      const utf8Data = new TextEncoder().encode(data);
      let binaryString = "";
      for (let i = 0; i < utf8Data.length; i++) {
        binaryString += String.fromCharCode(utf8Data[i]);
      }
      return btoa(binaryString)
      .replace(/\+/g, "-") // Base64 -> Base64URL
      .replace(/\//g, "_") // Base64 -> Base64URL
      .replace(/=+$/, ""); // 패딩 제거
    }

    function deleteGroup(button,event){
      event.stopPropagation();

      const row = button.closest("tr");
      const groupName = row.getAttribute("data-group-name");
      const calendarGroupId = row.getAttribute("data-calendar-group-id");

      const formData = {
        calendarGroupId: calendarGroupId
      };

      if (confirm(`"${groupName}" 그룹을 삭제하시겠습니까?`)) {
        fetch("/calendar/group", {
          method: 'DELETE',
          headers: {'Content-Type':'application/json', [_csrf_header]: _csrf},
          body: JSON.stringify(formData)
        })
        .then((response) => {
          if (response.ok) {
            alert("성공적으로 삭제했습니다.");
            window.location.href="/calendar/group";
          }else {
            alert("요청에 실패했습니다. 다시 시도해주세요");

          }
        })
        .catch((error) =>{
          console.log(error.message);
        })
      }
    }


  </script>

</head>
<body layout:fragment="content">

<div class="container-fluid d-flex justify-content-center mt-5">
  <div class="table-responsive w-75">
    <table class="table table-hover text-center">
      <thead class="table-light">
      <tr>
        <th scope="col">Group Name</th>
        <th scope="col">delete</th>
      </tr>
      </thead>
      <tbody>
      <tr th:each="group : ${groupList}"
          th:data-name="${group.name}"
          th:data-group-name="${group.groupName}"
          th:data-calendar-id="${group.calendarId}"
          th:data-calendar-group-id="${group.calendarGroupId}"
          onclick="fetchGroupDetails(this)">
        <td th:text="${group.groupName}" style="cursor: pointer; color: blue; text-decoration: underline;"></td>
        <td>
          <button type="submit" id="delete-group" class="btn btn-danger" onclick="deleteGroup(this,event)">
            delete
          </button>
        </td>
      </tr>
      </tbody>
    </table>
  </div>
</div>



</body>
</html>
