<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      layout:decorate="~{fragment/default}"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
>
<head>
  <title>홈 페이지</title>
</head>
<body>

<div layout:fragment="content">

  <div class="container d-flex justify-content-center align-items-center" style="height: 100vh;">
    <form class="user text-center" id="group-register" style="width: 100%; max-width: 400px;">

      <div class="form-group row justify-content-center">
        <div class="col-sm-10 mb-3 mb-sm-0">
          <input type="text" class="form-control form-control-user" id="groupName"
                 placeholder="group name" required>
        </div>
      </div>
      <hr class="sidebar-divider">

      <button type="submit" class="btn btn-primary btn-user btn-block">
        Register Group
      </button>
      <hr>

    </form>

    <script th:inline="javascript">
    document.getElementById("group-register").addEventListener("submit",function (event) {
      event.preventDefault();

      const groupName = document.getElementById("groupName").value;


      if (!groupName.trim()) {
        alert("그룹이름을 올바르게 입력해주세요. 다시 확인해주세요");
        return;
      }

      const formData = {
        groupName: groupName,

      }

      fetch("/calendar/group",{
        method: 'POST',
        headers: {'Content-Type':'application/json', [_csrf_header]: _csrf},
        body: JSON.stringify(formData)
      })
      .then(response =>{
        if (response.ok) {
          window.location.href = "/calendar/group/register";
        } else{
          return response.json();
        }
      })
      .then(data =>{
        if (data && data.message){
          alert(data.message);
        }
      })
      .catch(error =>{
        console.log(error.message);
        alert("다시 시도해주세요");
      })

    })
  </script>

</div>
</body>
</html>
