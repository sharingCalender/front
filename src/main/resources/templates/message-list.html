<!DOCTYPE html>
<html lang="en"

      xmlns:th="http://www.thymeleaf.org"
      layout:decorate="~{fragment/default}"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
>
<head>
  <meta charset="UTF-8">
  <title>BeONE - Group 목록</title>
  <link th:href="@{https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css}" rel="stylesheet">
  <script>




    function deleteInvitation(button){


      const row = button.closest("tr");
      const groupInvitationId = row.getAttribute("data-group-invitation-id");


      const formData = {
        groupInvitationId: groupInvitationId
      };

      if (confirm(`"해당 초대를 삭제하시겠습니까?`)) {
        fetch("/calendar/group/invitation", {
          method: 'DELETE',
          headers: {'Content-Type':'application/json', [_csrf_header]: _csrf},
          body: JSON.stringify(formData)
        })
        .then((response) => {
          if (response.ok) {
            alert("성공적으로 삭제했습니다.");
            window.location.href="/calendar/group/invitation/list";
          }else {
            alert("요청에 실패했습니다. 다시 시도해주세요");

          }
        })
        .catch((error) =>{
          console.log(error.message);
        })
      }
    }

    function acceptInvitation(button) {
      const row = button.closest("tr");

      const calendarGroupId = row.getAttribute("data-calendar-group-id");
      const groupInvitationId = row.getAttribute("data-group-invitation-id");

      const formData = {
        calendarGroupId: calendarGroupId,
        groupInvitationId: groupInvitationId
      }

      if (confirm(`"해당 초대를 수락하시겠습니까?`)){
        fetch("/calendar/group/invitation/accept", {
          method: 'POST',
          headers: {'Content-Type': 'application/json', [_csrf_header]: _csrf},
          body: JSON.stringify(formData)
        })
        .then(response => {
          if (response.ok) {
            alert("그룹에 참여했습니다.");
            window.location.href = "/calendar/group/invitation/list";

          } else {
            alert("요청에 실패했습니다. 다시 시도해주세요");
          }
        })
        .catch((error) => {
          console.log(error.message);
        })

      }

    }


    document.addEventListener("DOMContentLoaded", function () {

      document.querySelectorAll(".delete-invitation-btn").forEach(button => {
        button.addEventListener("click", function () {
          deleteInvitation(this);
        });
      });


      document.querySelectorAll(".invitation-group-btn").forEach(button =>{
        button.addEventListener("click",function (){
          acceptInvitation(this);
        });
      });
    });

  </script>

</head>
<body layout:fragment="content">



<div class="container-fluid d-flex justify-content-center mt-5">
  <div class="table-responsive w-75">
    <table class="table table-hover text-center">
      <thead class="table-light">
      <tr>
        <th scope="col">Group Name</th>
        <th scope="col">초대한 사람 아이디</th>
        <th scope="col">수락</th>
        <th scope="col">삭제</th>
      </tr>
      </thead>
      <tbody>
      <tr th:each="invitation : ${invitationList}"
          th:data-username-from="${invitation.usernameFrom}"
          th:data-group-name="${invitation.groupName}"
          th:data-group-invitation-id="${invitation.groupInvitationId}"
          th:data-calendar-group-id="${invitation.calendarGroupId}">
        <td th:text="${invitation.groupName}" style="cursor: pointer; color: blue; text-decoration: underline;"></td>
        <td th:text="${invitation.usernameFrom}" style="cursor: pointer; color: blue; text-decoration: underline;"></td>
        <td>
          <button type="button" id="accept-invitation" class="btn btn-primary invitation-group-btn">
            수락
          </button>
        </td>
        <td>
          <button type="button" id="delete-invitation" class="btn btn-danger delete-invitation-btn">
            거절
          </button>
        </td>

      </tr>
      </tbody>
    </table>
  </div>
</div>



</body>
</html>
