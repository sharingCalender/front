<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <meta name="description" content="">
    <meta name="author" content="">
    <meta name="_csrf" th:content="${_csrf.token}">
    <meta name="_csrf_header" th:content="${_csrf.headerName}" />

    <title>SB Admin 2 - Register</title>

    <!-- Custom fonts for this template-->
    <link href="/vendor/fontawesome-free/css/all.min.css" rel="stylesheet" type="text/css">
    <link
        href="https://fonts.googleapis.com/css?family=Nunito:200,200i,300,300i,400,400i,600,600i,700,700i,800,800i,900,900i"
        rel="stylesheet">

    <!-- Custom styles for this template-->
    <link href="/css/sb-admin-2.min.css" rel="stylesheet">

    <style>
    .error-message {
    white-space: nowrap;  /* 줄바꿈 방지 */
    }
    </style>

</head>

<body class="bg-gradient-primary">

    <div class="container">

        <div class="card o-hidden border-0 shadow-lg my-5">
            <div class="card-body p-0">
                <!-- Nested Row within Card Body -->
                <div class="row">
                    <div class="col-lg-5 d-none d-lg-block bg-register-image"></div>
                    <div class="col-lg-7">
                        <div class="p-5">
                            <div class="text-center">
                                <h1 class="h4 text-gray-900 mb-4">Create an Account!</h1>
                            </div>
                            <form class="user" id="register">
                                <div class="form-group row">
                                    <div class="col-sm-6 mb-3 mb-sm-0">
                                        <input type="text" class="form-control form-control-user" id="name"
                                            placeholder="name" required>
                                    </div>
                                </div>
                                <hr class="sidebar-divider">

                                <div class="form-group">
                                    <input type="email" class="form-control form-control-user" id="email"
                                        placeholder="Email Address" required pattern="[a-z0-9._%+\-]+@[a-z0-9.\-]+\.[a-z]{2,}$">
                                </div>

                                <hr class="sidebar-divider">

                                <div class="col-sm-6 mb-3 mb-sm-0">
                                    <input type="text" class="form-control form-control-user" id="login-id"
                                           placeholder="loginId" required>
                                </div>
                                <hr class="sidebar-divider">

                                <div class="form-group row">
                                    <div class="col-sm-6 mb-3 mb-sm-0">
                                        <input type="password" class="form-control form-control-user"
                                            id="password" placeholder="Password" required oninput="validatePassword()">
                                        <div id="password-error" class="error-message">비밀번호는 8글자이상 30글자 이하로 입력해주세요</div>

                                    </div>
                                    <div class="col-sm-6">
                                        <input type="password" class="form-control form-control-user"
                                            id="repeat-password" placeholder="Repeat Password" required>
                                    </div>
                                </div>
                                <hr class="sidebar-divider">

                                <div class="col-sm-6 mb-3 mb-sm-0">
                                    <input type="tel" class="form-control phone-input" id="mobile" placeholder="010-0000-0000" required oninput="validateMobile()">
                                    <div id="mobile-error" class="error-message">핸드폰 번호는 "010-0000-0000" 형식으로 입력해주세요</div>
                                </div>
                                <hr class="sidebar-divider">

                                <button type="submit" class="btn btn-primary btn-user btn-block">
                                    Register Account
                                </button>
                                <hr>

                            </form>
                            <hr>
                            <div class="text-center">
                                <a class="small" href="/user/login">Already have an account? Login!</a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

    </div>

    <!-- Bootstrap core JavaScript-->
    <script src="/vendor/jquery/jquery.min.js"></script>
    <script src="/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>

    <!-- Core plugin JavaScript-->
    <script src="/vendor/jquery-easing/jquery.easing.min.js"></script>

    <!-- Custom scripts for all pages-->
    <script src="/js/sb-admin-2.min.js"></script>

<script th:inline="javascript">

    const _csrf = document.querySelector(`meta[name="_csrf"]`).getAttribute('content');
    const _csrf_header = document.querySelector('meta[name="_csrf_header"]').getAttribute('content');

    document.getElementById("register").addEventListener("submit",function (event) {
        event.preventDefault();

        const name = document.getElementById("name").value;
        const email = document.getElementById("email").value;
        const mobile = document.getElementById("mobile").value;
        const username = document.getElementById("login-id").value;
        const password = document.getElementById("password").value;
        const repeatPassword = document.getElementById("repeat-password").value;


        if (!/^[a-zA-Zㄱ-ㅎ가-힣]*$/.test(name)) {
            alert("이름은 영어나 한글만 입력할 수 있습니다.");
            return;
        }

        if (/^\d+$/.test(username)) {
            alert("아이디에 숫자만 입력할 수 없습니다.");
            return;
        }

        if (username.length < 8) {
            alert("아이디를 8글자 이상 작성해주세요");
            return;
        }

        if (/^\d/.test(username)) {
            alert("아이디 맨 앞글자는  숫자가 불가능합니다.");
            return;
        }


        if (/^\d+$/.test(password)) {
            alert("비밀번호는 숫자만 입력할 수 없습니다.");
            return;
        }

        if (password.length < 8 || password.length > 30) {
            alert("비밀번호는 8글자이상 30글자 이하여야 합니다.")
            return;
        }

        if (password !== repeatPassword) {
            alert("비밀번호가 일치하지 않습니다. 다시 확인해주세요");
            return;
        }

        const mobileNum = mobile.replaceAll('-','')

        if (!/^\d+$/.test(mobileNum) || mobileNum.length < 11) {
            alert("휴대폰 번호를 올바르게 입력해주세요");
            return;
        }

        const formData = {
            name: name,
            email: email,
            mobile: mobile,
            username: username,
            password: password
        };

        fetch("/user/register",{
            method: 'POST',
            headers: {'Content-Type':'application/json', [_csrf_header]: _csrf},
            body: JSON.stringify(formData)
        })
        .then(response =>{
            if (response.ok) {
                window.location.href = "/user/login";
            } else if (response.status == 409) {
                alert("아이디가 이미 존재합니다.")
            } else {
                console.log(response.status);
                throw new Error("다시 시도해주세요");
            }
        })
        .catch(error =>{
            console.log(error.message);
            alert("다시 시도해주세요");
        })

    })

    function validateMobile(){
        let mobile= document.getElementById("mobile");
        let mobileError = document.getElementById("mobile-error");


        mobileNum = mobile.value.replace(/[^0-9]/g, '');

        if (mobileNum.startsWith("010")) {
            if (mobileNum.length <= 3){
                mobile.value = mobileNum;
            } else if(mobileNum.length <= 7){
                mobile.value = `${mobileNum.slice(0,3)}-${mobileNum.slice(3)}`;
            }else if (mobileNum.length <= 11) {
                mobile.value = `${mobileNum.slice(0, 3)}-${mobileNum.slice(3, 7)}-${mobileNum.slice(7, 11)}`;
            }
        } else {
            mobileError.style.display = "block";
            return;
        }
        mobileError.style.display = (mobileNum.length === 11) ? "none" : "block";
    }

    function validatePassword() {
        let password = document.getElementById("password").value;
        let passwordError =  document.getElementById("password-error");

        if (password.length < 8 || password.length > 30) {
            passwordError.style.display = "block";
        } else {
            passwordError.style.display = "none";
        }
    }

</script>

</body>

</html>
